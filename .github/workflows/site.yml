name: Update predictions and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/20 * * * 5,6,0,1'   # every 20 minutes, Friday to Monday (UTC): race weekends
    - cron: '17 */6 * * 2,3,4'     # every 6 hours midweek

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Restore API cache
        uses: actions/cache@v4
        with:
          path: .cache/pipeline
          key: pipeline-${{ github.run_id }}
          restore-keys: pipeline-

      - run: pip install -r pipeline/requirements.txt

      - name: Build prediction data
        run: python -m pipeline.build

      - name: Commit data if it changed
        run: |
          git config user.name "pit-wall-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data pipeline/store
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update prediction data"
            git push
          fi

  deploy:
    needs: data
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run build
        working-directory: web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - id: pages
        uses: actions/deploy-pages@v4
